<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#FFFFFF" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="태그북" />
<meta name="format-detection" content="telephone=no" />
<title>태그북 · TAGBOOK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#FFFFFF;
    --paper-soft:#F5F5F7;
    --white:#FFFFFF;
    --ink:#1C1C1E;
    --ink-soft:#6E6E73;
    --ink-faint:#AEAEB2;
    --navy:#1C1C1E;
    --navy-deep:#000000;
    --berry:#D0463B;
    --brass:#B8874A;
    --line:#E5E5EA;
    --line-soft:#EFEFF1;
    --radius:14px;
    --shadow: 0 10px 24px -14px rgba(28,28,30,0.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:'Noto Serif KR', serif;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--brass); color:var(--white);}

  /* ---------- layout ---------- */
  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:236px; flex-shrink:0; background:var(--white);
    color:var(--ink); display:flex; flex-direction:column;
    padding:28px 20px; position:sticky; top:0; height:100vh;
    border-right:1px solid var(--line);
  }
  .main{flex:1; min-width:0; padding:36px 44px 80px;}

  /* ---------- logo / tag shape ---------- */
  .logo{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
  .logo-tag{
    position:relative; width:34px; height:24px; flex-shrink:0;
    background:var(--brass);
    clip-path: polygon(30% 0%, 100% 0%, 100% 100%, 30% 100%, 0% 50%);
  }
  .logo-tag::after{
    content:''; position:absolute; left:9px; top:50%; transform:translateY(-50%);
    width:6px; height:6px; border-radius:50%; background:var(--white);
  }
  .logo-text{font-size:19px; font-weight:700; letter-spacing:0.5px;}
  .logo-sub{font-size:10.5px; color:var(--ink-faint); letter-spacing:2.5px; margin:2px 0 0 46px; text-transform:uppercase;}

  .nav{margin-top:40px; display:flex; flex-direction:column; gap:4px;}
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:11px 12px; border-radius:10px; border:none; background:transparent;
    color:var(--ink-soft); font-size:14.5px; text-align:left; transition:background .15s, color .15s;
  }
  .nav-item:hover{background:var(--paper-soft); color:var(--ink);}
  .nav-item.active{background:var(--paper-soft); color:var(--ink); font-weight:700; box-shadow:inset 3px 0 0 var(--brass);}
  .nav-ico{width:16px; text-align:center; font-size:14px;}

  .sidebar-foot{margin-top:auto; padding-top:20px; border-top:1px solid var(--line);}
  .sidebar-foot-label{font-size:11px; color:var(--ink-faint); letter-spacing:1px;}
  .sidebar-foot-count{font-size:13px; color:var(--ink); margin-top:4px;}

  /* ---------- mobile bottom nav ---------- */
  .bottom-nav{
    display:none; position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:rgba(255,255,255,0.94); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    justify-content:space-around; align-items:center;
  }
  .bn-item{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    border:none; background:transparent; color:var(--ink-faint);
    padding:6px 18px; border-radius:12px; min-width:64px;
  }
  .bn-item.active{color:var(--ink); font-weight:700;}
  .bn-ico{font-size:19px;}
  .bn-label{font-size:10.5px;}

  /* ---------- header ---------- */
  .page-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:12px;}
  .page-title{font-size:26px; font-weight:700; margin:0;}
  .page-desc{color:var(--ink-soft); font-size:13.5px; margin-top:6px;}

  .btn{
    border:none; border-radius:9px; padding:10px 18px; font-size:13.5px; font-weight:600;
    background:var(--navy); color:var(--white); transition:transform .12s, background .15s;
  }
  .btn:hover{background:var(--navy-deep);}
  .btn:active{transform:scale(0.97);}
  .btn-brass{background:var(--brass); color:#fff;}
  .btn-brass:hover{background:#9c7238;}
  .btn-ghost{background:transparent; border:1.4px solid var(--line); color:var(--ink);}
  .btn-ghost:hover{background:var(--paper-soft);}
  .btn-berry{background:var(--berry); color:#fff;}
  .btn-berry:hover{background:#b23a30;}
  .btn-sm{padding:7px 13px; font-size:12.5px; border-radius:8px;}

  /* ---------- calendar ---------- */
  .cal-head{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
  .cal-month{font-size:20px; font-weight:700; min-width:150px;}
  .cal-nav-btn{
    width:32px; height:32px; border-radius:50%; border:1.4px solid var(--line);
    background:var(--white); font-size:14px; display:flex; align-items:center; justify-content:center;
  }
  .cal-nav-btn:hover{border-color:var(--brass); color:var(--brass);}
  .cal-today-btn{margin-left:4px;}

  .cal-grid{
    background:var(--line-soft); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden;
    display:grid; grid-template-columns:repeat(7,1fr); gap:1px;
  }
  .cal-dow{
    background:var(--navy); color:#F2F2F3; text-align:center; font-size:11.5px;
    padding:9px 0; font-weight:700; letter-spacing:1px;
  }
  .cal-dow.sun{color:#FF9F90;}
  .cal-cell{
    background:var(--white); aspect-ratio:1/1; position:relative; overflow:hidden;
    cursor:pointer; transition:outline .1s;
  }
  .cal-cell.blank{background:var(--paper-soft); cursor:default;}
  .cal-cell:hover:not(.blank){outline:2px solid var(--brass); outline-offset:-2px; z-index:1;}
  .cal-daynum{
    position:absolute; top:5px; left:6px; font-size:11px; font-weight:700; color:var(--ink-soft);
    z-index:2; background:rgba(255,255,255,0.85); border-radius:5px; padding:0 3px;
  }
  .cal-cell.has-outfit .cal-daynum{color:#fff; background:rgba(28,28,30,0.5);}
  .cal-thumb{width:100%; height:100%; object-fit:cover; display:block;}
  .cal-today .cal-daynum{background:var(--berry); color:#fff;}
  .cal-empty-plus{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--ink-faint); font-size:18px; opacity:0; transition:opacity .12s;
  }
  .cal-cell:hover .cal-empty-plus{opacity:1;}

  /* ---------- cards / forms ---------- */
  .panel{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:26px; box-shadow:var(--shadow);}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; letter-spacing:.3px;}
  .field input[type=text], .field input[type=date], .field input[type=number], .field select{
    width:100%; padding:10px 12px; border:1.4px solid var(--line); border-radius:9px;
    background:var(--paper-soft); font-size:13.5px; color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--brass); outline-offset:1px; background:var(--white);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

  .photo-drop{
    border:1.6px dashed var(--line); border-radius:12px; background:var(--paper-soft);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:22px; text-align:center; cursor:pointer; position:relative; overflow:hidden; min-height:150px;
  }
  .photo-drop:hover{border-color:var(--brass);}
  .photo-drop img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .photo-drop .hint{font-size:12px; color:var(--ink-faint); margin-top:6px;}
  .photo-drop .ico{font-size:22px; color:var(--ink-faint);}
  .photo-drop input{display:none;}

  .upload-grid{display:grid; grid-template-columns:280px 1fr; gap:28px; align-items:start;}

  /* item mini-card in draft */
  .item-chip-list{display:flex; flex-wrap:wrap; gap:12px; margin-top:14px;}
  .item-chip{
    width:92px; position:relative; background:var(--paper-soft); border:1px solid var(--line);
    border-radius:10px; padding:6px; text-align:center;
  }
  .item-chip img{width:100%; height:66px; object-fit:cover; border-radius:6px; background:#eee;}
  .item-chip .cat{font-size:10px; color:var(--ink-faint); margin-top:4px;}
  .item-chip .nm{font-size:11px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .item-chip .rm{
    position:absolute; top:-6px; right:-6px; width:19px; height:19px; border-radius:50%;
    background:var(--berry); color:#fff; border:none; font-size:11px; line-height:1;
  }
  .add-item-chip{
    width:92px; height:96px; border:1.6px dashed var(--line); border-radius:10px;
    display:flex; align-items:center; justify-content:center; background:var(--paper-soft);
    color:var(--ink-faint); font-size:22px; flex-direction:column; gap:4px;
  }
  .add-item-chip:hover{border-color:var(--brass); color:var(--brass);}
  .add-item-chip span{font-size:10.5px;}

  /* ---------- outfit detail ---------- */
  .detail-grid{display:grid; grid-template-columns:1fr 300px; gap:30px; align-items:start;}
  .detail-photo-wrap{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow);}
  .detail-photo-wrap img{width:100%; border-radius:9px; display:block; max-height:560px; object-fit:cover;}
  .detail-meta{display:flex; justify-content:space-between; margin-top:14px; padding:0 4px;}
  .detail-meta .d{font-size:15px; font-weight:700;}
  .detail-meta .l{font-size:13px; color:var(--ink-soft);}

  .side-panel{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); position:sticky; top:24px;}
  .side-panel h3{margin:0 0 14px; font-size:14px; letter-spacing:.3px;}
  .side-items{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .side-item-thumb{
    cursor:pointer; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--paper-soft);
    transition:transform .12s, box-shadow .12s;
  }
  .side-item-thumb:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .side-item-thumb img{width:100%; height:78px; object-fit:cover; display:block;}
  .side-item-thumb .cap{padding:6px 7px 8px;}
  .side-item-thumb .cat{font-size:9.5px; color:var(--brass); font-weight:700; letter-spacing:.3px;}
  .side-item-thumb .nm{font-size:11.5px; font-weight:700; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ---------- item detail (tag card) ---------- */
  .tagcard{
    background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:0; overflow:hidden; max-width:420px;
  }
  .tagcard-photo{width:100%; height:260px; object-fit:cover; background:var(--paper-soft); display:block;}
  .tagcard-body{padding:22px 24px 24px; position:relative;}
  .tagcard-punch{
    position:absolute; top:-13px; left:24px; width:26px; height:26px; border-radius:50%;
    background:var(--paper); border:5px solid var(--white);
  }
  .tagcard-brand{font-size:11.5px; color:var(--brass); font-weight:700; letter-spacing:1.5px; text-transform:uppercase;}
  .tagcard-name{font-size:20px; font-weight:700; margin:4px 0 14px; font-family:'Noto Serif KR', serif;}
  .tagcard-row{display:flex; justify-content:space-between; padding:9px 0; border-top:1px dashed var(--line); font-size:13px;}
  .tagcard-row:first-of-type{border-top:1px dashed var(--line);}
  .tagcard-row .k{color:var(--ink-soft);}
  .tagcard-row .v{font-weight:700;}
  .tagcard-freq{
    margin-top:14px; background:var(--paper-soft); border-radius:9px; padding:10px 12px;
    font-size:12.5px; color:var(--ink-soft); display:flex; justify-content:space-between; align-items:center;
  }
  .tagcard-freq b{color:var(--navy); font-size:14px;}

  /* ---------- gallery ---------- */
  .gallery-tools{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; align-items:center;}
  .search-box{
    display:flex; align-items:center; gap:8px; background:var(--white); border:1.4px solid var(--line);
    border-radius:9px; padding:8px 12px; flex:1; min-width:220px;
  }
  .search-box input{border:none; background:transparent; outline:none; font-size:13.5px; width:100%;}
  .search-box .ico{color:var(--ink-faint);}
  .chip-select{
    border:1.4px solid var(--line); background:var(--white); border-radius:9px; padding:8px 12px; font-size:13px; color:var(--ink);
  }
  .sort-tabs{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap;}
  .sort-tab{padding:7px 13px; border-radius:20px; border:1.4px solid var(--line); background:var(--white); font-size:12.5px; color:var(--ink-soft);}
  .sort-tab.active{background:var(--navy); border-color:var(--navy); color:#fff; font-weight:700;}

  .brand-groups{display:flex; flex-direction:column; gap:28px;}
  .brand-group-head{display:flex; align-items:baseline; gap:9px; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--line);}
  .brand-group-head .bg-name{font-size:16px; font-weight:700;}
  .brand-group-head .bg-count{font-size:12px; color:var(--ink-faint);}

  .item-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:16px;}
  .item-card{
    background:var(--white); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer;
    transition:transform .12s, box-shadow .12s;
  }
  .item-card:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
  .item-card img{width:100%; height:130px; object-fit:cover; background:var(--paper-soft); display:block;}
  .item-card .ic-body{padding:10px 11px 12px;}
  .item-card .ic-cat{font-size:9.5px; color:var(--brass); font-weight:700; letter-spacing:.5px;}
  .item-card .ic-name{font-size:12.5px; font-weight:700; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item-card .ic-brand{font-size:11px; color:var(--ink-soft); margin-top:1px;}
  .item-card .ic-freq{
    margin-top:7px; font-size:10.5px; color:var(--navy); background:var(--paper-soft);
    display:inline-block; padding:2px 7px; border-radius:20px; font-weight:700;
  }

  /* ---------- empty states ---------- */
  .empty{
    text-align:center; padding:70px 20px; color:var(--ink-faint);
  }
  .empty .big-tag{width:52px; height:38px; margin:0 auto 16px; background:var(--line-soft); clip-path: polygon(30% 0%, 100% 0%, 100% 100%, 30% 100%, 0% 50%); position:relative;}
  .empty .big-tag::after{content:''; position:absolute; left:14px; top:50%; transform:translateY(-50%); width:9px; height:9px; border-radius:50%; background:var(--white);}
  .empty p{font-size:13.5px; margin:0 0 16px;}

  /* ---------- modal ---------- */
  .modal-bg{
    position:fixed; inset:0; background:rgba(28,28,30,0.5); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:24px; backdrop-filter:blur(2px);
  }
  .modal-close{
    position:absolute; top:-14px; right:-14px; width:32px; height:32px; border-radius:50%;
    background:var(--ink); color:#fff; border:3px solid var(--white); font-size:14px;
  }
  .modal-wrap{position:relative;}

  .fade-note{font-size:11.5px; color:var(--ink-faint); text-align:center; margin-top:34px;}

  /* ---------- mobile / iPhone·iPad ---------- */
  @media (max-width: 860px){
    .sidebar{display:none;}
    .bottom-nav{display:flex;}
    .app{flex-direction:column;}
    .main{padding:20px 16px calc(88px + env(safe-area-inset-bottom));}
    .upload-grid, .detail-grid{grid-template-columns:1fr;}
    .side-panel{position:static;}
    .page-title{font-size:22px;}
    .sort-tabs{margin-left:0; width:100%;}
    .gallery-tools{flex-direction:column; align-items:stretch;}
    .chip-select{width:100%;}
    /* prevent iOS auto-zoom on focus */
    .field input[type=text], .field input[type=date], .field input[type=number],
    .field select, .search-box input{font-size:16px;}
    .cal-empty-plus{opacity:.32;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============ FIREBASE (기기 간 연동용 — 아래 6개 값을 본인 프로젝트 값으로 교체) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDVuJu9oXiVpgiRUBznXi4hWYftvDTeOJA",
  authDomain: "tagbook-e40de.firebaseapp.com",
  projectId: "tagbook-e40de",
  storageBucket: "tagbook-e40de.firebasestorage.app",
  messagingSenderId: "62814800892",
  appId: "1:62814800892:web:aa666f0a3b76a4e2b94079"
};
let db = null;
let firebaseReady = false;
try{
  if(firebaseConfig.apiKey !== "YOUR_API_KEY" && typeof firebase !== 'undefined'){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
  }
}catch(e){ firebaseReady = false; }

/* ============ STATE ============ */
const CATS = ['아우터','상의','하의','신발','액세서리','기타'];
const CAT_ICON = {'상의':'👕','하의':'👖','아우터':'🧥','신발':'👟','액세서리':'⌚','기타':'✦'};
const NAV_ITEMS = [
  { key:'calendar', icon:'📅', label:'캘린더' },
  { key:'gallery', icon:'🗂️', label:'아이템 갤러리' }
];

const state = {
  view: 'calendar', // calendar | upload | outfitDetail | gallery
  outfits: [],
  items: [],
  calMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  selectedOutfitId: null,
  selectedItemId: null,      // for modal
  draft: null,               // {date, location, photo, itemIds:[]}
  addingItem: null,          // {mode:'new'|'pick', category} while composing
  pickerSearch: '',
  galleryQuery: '',
  galleryCat: 'all',
  gallerySort: 'freq',       // freq | recent | purchase
  prefDate: null,
  storageMode: 'none',       // 'firebase' | 'cloud' | 'local' | 'none'
  syncCode: null
};
try{ state.syncCode = localStorage.getItem('tagbook-sync-code'); }catch(e){ state.syncCode = null; }

function uid(p){ return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){
  if(!s) return '';
  const [y,m,d] = s.split('-');
  return `${y}.${m}.${d}`;
}
function fmtWon(n){
  if(n === '' || n === null || n === undefined || isNaN(n)) return '-';
  return Number(n).toLocaleString('ko-KR') + '원';
}
function outfitsUsingItem(itemId){
  return state.outfits.filter(o => o.itemIds.includes(itemId)).length;
}
function readFileAsDataURL(file){
  return new Promise((res)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.readAsDataURL(file);
  });
}
/* ============ SAVE / LOAD (persistent storage) ============ */
async function loadState(){
  // 0) Firebase 연동이 설정된 경우 — 기기 간 진짜 동기화
  if(firebaseReady && state.syncCode){
    state.storageMode = 'firebase';
    try{
      const doc = await db.collection('tagbook').doc(state.syncCode).get();
      if(doc.exists){
        const data = doc.data();
        state.outfits = Array.isArray(data.outfits) ? data.outfits : [];
        state.items = Array.isArray(data.items) ? data.items : [];
      }
    }catch(e){
      console.error('불러오기 실패:', e);
    }
    return;
  }
  // 1) 클로드 아티팩트 안에서 열린 경우 — 계정 기준 클라우드 저장
  if(typeof window.storage !== 'undefined'){
    state.storageMode = 'cloud';
    try{
      const res = await window.storage.get('tagbook-data', false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        state.outfits = Array.isArray(parsed.outfits) ? parsed.outfits : [];
        state.items = Array.isArray(parsed.items) ? parsed.items : [];
      }
    }catch(e){
      // 저장된 데이터가 아직 없는 경우
    }
    return;
  }
  // 2) 다운로드해서 파일로 직접 여는 경우 — 이 기기의 브라우저에 저장 (기기별로 따로 저장됨)
  try{
    const raw = localStorage.getItem('tagbook-data');
    if(raw){
      const parsed = JSON.parse(raw);
      state.outfits = Array.isArray(parsed.outfits) ? parsed.outfits : [];
      state.items = Array.isArray(parsed.items) ? parsed.items : [];
    }
    state.storageMode = 'local';
  }catch(e){
    state.storageMode = 'none';
  }
}
async function saveState(){
  if(state.storageMode === 'firebase'){
    try{
      await db.collection('tagbook').doc(state.syncCode).set({ outfits: state.outfits, items: state.items, updatedAt: Date.now() });
    }catch(e){
      console.error('저장 실패:', e);
    }
    return;
  }
  if(state.storageMode === 'cloud'){
    try{
      await window.storage.set('tagbook-data', JSON.stringify({ outfits: state.outfits, items: state.items }), false);
    }catch(e){
      console.error('저장 실패:', e);
    }
  } else if(state.storageMode === 'local'){
    try{
      localStorage.setItem('tagbook-data', JSON.stringify({ outfits: state.outfits, items: state.items }));
    }catch(e){
      console.error('저장 실패:', e);
    }
  }
}

function sortItems(list, sortKey){
  const arr = list.slice();
  if(sortKey === 'freq'){
    arr.sort((a,b)=> outfitsUsingItem(b.id) - outfitsUsingItem(a.id));
  } else if(sortKey === 'purchase'){
    arr.sort((a,b)=>{
      if(!a.purchaseDate && !b.purchaseDate) return 0;
      if(!a.purchaseDate) return 1;
      if(!b.purchaseDate) return -1;
      return b.purchaseDate.localeCompare(a.purchaseDate);
    });
  } else { // recent (registered)
    arr.sort((a,b)=> (b.id > a.id ? 1 : -1));
  }
  return arr;
}

/* ============ RENDER ROOT ============ */

  const app = document.getElementById('app');
  app.innerHTML = '';

  app.appendChild(renderBottomNav());

  if(state.selectedItemId){
    app.appendChild(renderItemModal());
  }
  if(state.addingItem){

  }
}

/* ============ CALENDAR VIEW ============ */
function renderCalendarView(){
  const wrap = document.createElement('div');
  const y = state.calMonth.getFullYear();
  const m = state.calMonth.getMonth();
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const todayS = todayStr();

  const head = document.createElement('div');
  head.className = 'page-head';
  head.innerHTML = `
    <div>
      <h1 class="page-title serif">캘린더</h1>
      <div class="page-desc">날짜를 누르면 그날의 코디를 보거나 새로 기록할 수 있어요</div>
    </div>
    <button class="btn btn-brass" id="quick-add">+ 오늘 코디 등록</button>
  `;
  wrap.appendChild(head);

  const calHead = document.createElement('div');
  calHead.className = 'cal-head';
  calHead.innerHTML = `
    <button class="cal-nav-btn" id="prev-m">‹</button>
    <div class="cal-month serif">${y}년 ${m+1}월</div>
    <button class="cal-nav-btn" id="next-m">›</button>
    <button class="btn btn-ghost btn-sm cal-today-btn" id="today-btn">오늘</button>
  `;
  wrap.appendChild(calHead);

  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  ['일','월','화','수','목','금','토'].forEach((d,i)=>{
    const dow = document.createElement('div');
    dow.className = 'cal-dow' + (i===0?' sun':'');
    dow.textContent = d;
    grid.appendChild(dow);
  });
  for(let i=0;i<startDow;i++){
    const c = document.createElement('div');
    c.className = 'cal-cell blank';
    grid.appendChild(c);
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const outfit = state.outfits.find(o=>o.date===dateStr);
    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (outfit?' has-outfit':'') + (dateStr===todayS?' cal-today':'');
    if(outfit){
      cell.innerHTML = `<img class="cal-thumb" src="${outfit.photo}" /><div class="cal-daynum">${d}</div>`;
      cell.addEventListener('click', ()=>{ state.selectedOutfitId = outfit.id; state.view='outfitDetail'; render(); });
    } else {
      cell.innerHTML = `<div class="cal-daynum">${d}</div><div class="cal-empty-plus">+</div>`;
      cell.addEventListener('click', ()=>{
        state.prefDate = dateStr;
        state.draft = { date: dateStr, location:'', photo:null, itemIds:[] };
        state.view='upload'; render();
      });
    }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  wrap.appendChild(Object.assign(document.createElement('div'),{className:'fade-note', textContent:
    state.storageMode === 'firebase' ? `🔗 "${state.syncCode}" 코드로 기기 간 연동 중이에요` :
    state.storageMode === 'cloud' ? '☁️ 코디와 아이템은 자동으로 저장돼요' :
    state.storageMode === 'local' ? '📱 이 기기 브라우저에 저장돼요 (다른 기기와는 공유되지 않아요)' :
    '※ 지금은 저장이 지원되지 않는 환경이라 새로고침하면 초기화돼요'
  }));

  head.querySelector('#quick-add').addEventListener('click', ()=>{
    state.prefDate = todayS;
    state.draft = { date: todayS, location:'', photo:null, itemIds:[] };
    state.view='upload'; render();
  });
  calHead.querySelector('#prev-m').addEventListener('click', ()=>{ state.calMonth = new Date(y,m-1,1); render(); });
  calHead.querySelector('#next-m').addEventListener('click', ()=>{ state.calMonth = new Date(y,m+1,1); render(); });
  calHead.querySelector('#today-btn').addEventListener('click', ()=>{ state.calMonth = new Date(new Date().getFullYear(), new Date().getMonth(),1); render(); });

  return wrap;
}

/* ============ UPLOAD VIEW ============ */

    </div>
  `;
  wrap.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'upload-grid';

  // left: photo
  const left = document.createElement('div');
  left.innerHTML = `
    <div class="photo-drop" id="outfit-photo-drop">
      ${d.photo ? `<img src="${d.photo}"/>` : `<div class="ico">📷</div><div>코디 전체 사진</div><div class="hint">클릭해서 업로드</div>`}

  `;
  grid.appendChild(left);

  // right: form
  const right = document.createElement('div');
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `
    <div class="row2">
      <div class="field">
        <label>날짜</label>
        <input type="date" id="f-date" value="${d.date}" />
      </div>
      <div class="field">
        <label>지역</label>
        <input type="text" id="f-loc" placeholder="예: 성수동, 서울" value="${d.location}" />
      </div>
    </div>
    <div class="field">
      <label>아이템 (${d.itemIds.length}개)</label>
      <div class="item-chip-list" id="chip-list"></div>
    </div>
    <div style="display:flex; gap:10px; margin-top:22px;">
      <button class="btn btn-brass" id="save-outfit">코디 저장</button>
      <button class="btn btn-ghost" id="cancel-outfit">취소</button>
    </div>
  `;
  right.appendChild(panel);
  grid.appendChild(right);
  wrap.appendChild(grid);

  // chip list render
  const chipList = panel.querySelector('#chip-list');
  d.itemIds.forEach(id=>{
    const it = state.items.find(x=>x.id===id);
    if(!it) return;
    const chip = document.createElement('div');
    chip.className = 'item-chip';
    chip.innerHTML = `
      <button class="rm">×</button>
      <img src="${it.photo}"/>
      <div class="cat">${CAT_ICON[it.category]||''} ${it.category}</div>
      <div class="nm">${it.brand||'브랜드 미상'}</div>
    `;
    chip.querySelector('.rm').addEventListener('click', (e)=>{
      e.stopPropagation();
      d.itemIds = d.itemIds.filter(x=>x!==id);
      render();
    });
    chipList.appendChild(chip);
  });
  const addChip = document.createElement('button');
  addChip.className = 'add-item-chip';
  addChip.innerHTML = `+<span>아이템 추가</span>`;
  addChip.addEventListener('click', ()=>{ state.addingItem = { mode:null, category: CATS[0] }; render(); });
  chipList.appendChild(addChip);

  // events
  const dropEl = left.querySelector('#outfit-photo-drop');
  const inputEl = left.querySelector('#outfit-photo-input');
  dropEl.addEventListener('click', ()=>inputEl.click());
  inputEl.addEventListener('change', async (e)=>{
    const f = e.target.files[0];
    if(f){ d.photo = await readFileAsDataURL(f); render(); }
  });
  panel.querySelector('#f-date').addEventListener('input', e=>{ d.date = e.target.value; });
  panel.querySelector('#f-loc').addEventListener('input', e=>{ d.location = e.target.value; });
  panel.querySelector('#cancel-outfit').addEventListener('click', ()=>{
    state.draft = null; state.view = 'calendar'; render();
  });
  panel.querySelector('#save-outfit').addEventListener('click', ()=>{
    if(!d.photo){ alert('코디 전체 사진을 업로드해주세요.'); return; }
    if(!d.date){ alert('날짜를 선택해주세요.'); return; }
    const existingIdx = state.outfits.findIndex(o=>o.date===d.date);
    const outfit = { id: uid('outfit'), date:d.date, location:d.location, photo:d.photo, itemIds:[...d.itemIds] };
    if(existingIdx>-1){
      if(!confirm('해당 날짜에 이미 코디가 있어요. 덮어쓸까요?')) return;
      outfit.id = state.outfits[existingIdx].id;
      state.outfits[existingIdx] = outfit;
    } else {
      state.outfits.push(outfit);
    }
    state.selectedOutfitId = outfit.id;
    state.draft = null;
    state.view = 'outfitDetail';
    saveState();
    render();
  });

  return wrap;
}

    panel.querySelector('#close-modal').addEventListener('click', ()=>{ state.addingItem=null; state.pickerSearch=''; render(); });

        <div class="field"><label>브랜드명</label><input type="text" id="f-brand" placeholder="예: 뉴발란스" value="${f.brand}"/></div>

      </div>
      <div class="field"><label>구매 가격 (원)</label><input type="number" id="f-price" placeholder="예: 189000" value="${f.price}"/></div>

    panel.querySelector('#f-model').addEventListener('input', e=>f.modelNo=e.target.value);

  bg.appendChild(wrap);

    side.appendChild(gridEl);
  }
  grid.appendChild(side);
  wrap.appendChild(grid);

  head.querySelector('#back-cal').addEventListener('click', ()=>{ state.view='calendar'; render(); });
  head.querySelector('#del-outfit').addEventListener('click', ()=>{
    if(confirm('이 코디 기록을 삭제할까요? (아이템 정보는 유지됩니다)')){
      state.outfits = state.outfits.filter(x=>x.id!==o.id);
      state.view='calendar';
      saveState();
      render();
    }
  });

  return wrap;
}

/* ============ ITEM DETAIL MODAL (tag card) ============ */
function renderItemModal(){
  const it = state.items.find(x=>x.id===state.selectedItemId);
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  if(!it){ state.selectedItemId=null; return bg; }
  const wrap = document.createElement('div');
  wrap.className = 'modal-wrap';
  const freq = outfitsUsingItem(it.id);
  wrap.innerHTML = `
    <button class="modal-close" id="close-item-modal">×</button>
    <div class="tagcard">
      <img class="tagcard-photo" src="${it.photo}"/>
      <div class="tagcard-body">
        <div class="tagcard-punch"></div>
        <div class="tagcard-brand">${CAT_ICON[it.category]||''} ${it.category} · ${it.brand || '브랜드 미상'}</div>
        <div class="tagcard-name serif">${it.name || '이름 미등록'}</div>
        <div class="tagcard-row"><div class="k">품번</div><div class="v">${it.modelNo || '-'}</div></div>
        <div class="tagcard-row"><div class="k">구매일</div><div class="v">${it.purchaseDate ? fmtDate(it.purchaseDate) : '-'}</div></div>
        <div class="tagcard-row"><div class="k">구매 가격</div><div class="v">${fmtWon(it.price)}</div></div>
        <div class="tagcard-freq">착용 코디 횟수 <b>${freq}회</b></div>
      </div>
    </div>
  `;
  bg.appendChild(wrap);
  bg.addEventListener('click', (e)=>{ if(e.target===bg){ state.selectedItemId=null; render(); } });
  wrap.querySelector('#close-item-modal').addEventListener('click', ()=>{ state.selectedItemId=null; render(); });
  return bg;
}

/* ============ GALLERY VIEW ============ */
function renderGalleryView(){
  const wrap = document.createElement('div');
  const head = document.createElement('div');
  head.className = 'page-head';
  head.innerHTML = `
    <div>
      <h1 class="page-title serif">아이템 갤러리</h1>
      <div class="page-desc">브랜드별로 모아봤어요 — 카테고리, 검색, 정렬로 좁혀보세요</div>
    </div>
  `;
  wrap.appendChild(head);

  const tools = document.createElement('div');
  tools.className = 'gallery-tools';
  tools.innerHTML = `
    <div class="search-box">
      <span class="ico">🔍</span>
      <input type="text" id="g-search" placeholder="브랜드, 제품명, 품번 검색" value="${state.galleryQuery}"/>
    </div>
    <select class="chip-select" id="g-cat">
      <option value="all">전체 카테고리</option>
      ${CATS.map(c=>`<option value="${c}" ${state.galleryCat===c?'selected':''}>${CAT_ICON[c]} ${c}</option>`).join('')}
    </select>
    <div class="sort-tabs">
      <button class="sort-tab ${state.gallerySort==='freq'?'active':''}" data-sort="freq">자주 입은 순</button>
      <button class="sort-tab ${state.gallerySort==='recent'?'active':''}" data-sort="recent">최근 등록순</button>
      <button class="sort-tab ${state.gallerySort==='purchase'?'active':''}" data-sort="purchase">구매일순</button>
    </div>
  `;
  wrap.appendChild(tools);

  let list = state.items.slice();
  const q = state.galleryQuery.trim().toLowerCase();
  if(q){
    list = list.filter(it => (it.brand||'').toLowerCase().includes(q) || (it.name||'').toLowerCase().includes(q) || (it.modelNo||'').toLowerCase().includes(q));
  }
  if(state.galleryCat !== 'all') list = list.filter(it=>it.category===state.galleryCat);

  if(list.length===0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `<div class="big-tag"></div><p>${state.items.length===0 ? '아직 등록된 아이템이 없어요' : '조건에 맞는 아이템이 없어요'}</p>`;
    if(state.items.length===0){
      const btn = document.createElement('button');
      btn.className = 'btn btn-brass btn-sm';
      btn.textContent = '코디 등록하러 가기';
      btn.addEventListener('click', ()=>{
        state.draft = { date: todayStr(), location:'', photo:null, itemIds:[] };
        state.view='upload'; render();
      });
      empty.appendChild(btn);
    }
    wrap.appendChild(empty);
  } else {
    // group by brand, brand headers sorted alphabetically, unbranded last
    const groups = new Map();
    list.forEach(it=>{
      const key = (it.brand && it.brand.trim()) ? it.brand.trim() : '브랜드 미상';
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(it);
    });
    const brandNames = Array.from(groups.keys()).sort((a,b)=>{
      if(a==='브랜드 미상') return 1;
      if(b==='브랜드 미상') return -1;
      return a.localeCompare(b, 'ko');
    });

    const container = document.createElement('div');
    container.className = 'brand-groups';
    brandNames.forEach(brand=>{
      const its = sortItems(groups.get(brand), state.gallerySort);
      const section = document.createElement('div');
      section.className = 'brand-group';
      section.innerHTML = `<div class="brand-group-head"><span class="bg-name serif">${brand}</span><span class="bg-count">${its.length}개</span></div>`;
      const g = document.createElement('div');
      g.className = 'item-grid';
      its.forEach(it=>{
        const c = document.createElement('div');
        c.className = 'item-card';
        c.innerHTML = `
          <img src="${it.photo}"/>
          <div class="ic-body">
            <div class="ic-cat">${CAT_ICON[it.category]||''} ${it.category}</div>
            <div class="ic-name">${it.name || '이름 미등록'}</div>
            <div class="ic-freq">${outfitsUsingItem(it.id)}회 착용</div>
          </div>
        `;
        c.addEventListener('click', ()=>{ state.selectedItemId = it.id; render(); });
        g.appendChild(c);
      });
      section.appendChild(g);
      container.appendChild(section);
    });
    wrap.appendChild(container);
  }

  tools.querySelector('#g-search').addEventListener('input', e=>{ state.galleryQuery=e.target.value; render(); });
  tools.querySelector('#g-cat').addEventListener('change', e=>{ state.galleryCat=e.target.value; render(); });
  tools.querySelectorAll('[data-sort]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.gallerySort=b.dataset.sort; render(); });
  });

  return wrap;
}

/* ============ SYNC CODE SETUP (firebase 연동 최초 1회) ============ */
function generateCode(){ return Math.random().toString(36).slice(2,8); }

function renderSyncSetup(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const suggested = generateCode();
  const wrap = document.createElement('div');
  wrap.style.cssText = 'max-width:380px;margin:70px auto;padding:0 20px;';
  wrap.innerHTML = `
    <h2 class="serif" style="margin-bottom:6px;">기기 연동 코드</h2>
    <div class="page-desc" style="margin-bottom:18px; line-height:1.5;">아이폰과 아이패드에 <b>같은 코드</b>를 입력하면 데이터가 하나로 이어져요.<br/>처음이라면 아래 추천 코드를 그대로 쓰거나 원하는 코드를 입력하세요.</div>
    <div class="field">
      <label>연동 코드</label>
      <input type="text" id="sync-code-input" placeholder="예: ${suggested}" style="width:100%;padding:10px 12px;border:1.4px solid var(--line);border-radius:9px;font-size:16px;background:var(--paper-soft);"/>
    </div>
    <button class="btn btn-brass" id="sync-start" style="width:100%;">시작하기</button>
    <div class="page-desc" style="margin-top:14px; line-height:1.5;">이 코드는 이 기기에 저장돼서 다음부터는 안 물어봐요.<br/>다른 기기(아이패드 등)에서도 <b>정확히 같은 코드</b>를 입력해야 데이터가 연동돼요.</div>
  `;
  app.appendChild(wrap);
  wrap.querySelector('#sync-start').addEventListener('click', async ()=>{
    let code = wrap.querySelector('#sync-code-input').value.trim();
    if(!code) code = suggested;
    code = code.toLowerCase().replace(/[^a-z0-9]/g,'');
    if(!code){ alert('코드를 입력해주세요.'); return; }
    try{ localStorage.setItem('tagbook-sync-code', code); }catch(e){}
    state.syncCode = code;
    document.getElementById('app').innerHTML = '<div style="padding:80px 20px;text-align:center;color:#6E6E73;font-size:13.5px;">불러오는 중…</div>';
    await loadState();
    render();
  });
}

async function init(){
  document.getElementById('app').innerHTML = '<div style="padding:80px 20px;text-align:center;color:#6E6E73;font-size:13.5px;">불러오는 중…</div>';
  if(firebaseReady && !state.syncCode){
    renderSyncSetup();
    return;
  }
  await loadState();
  render();
}
init();
</script>
</body>
</html>
