function askConfirm(message, onYes){
  // 네이티브 confirm()은 샌드박스 iframe(아티팩트 미리보기 등)에서 조용히 막혀
  // '삭제'가 안 먹는 것처럼 보이는 원인이 될 수 있어, 자체 모달로 대체
  state.confirmDialog = { message, onYes };
  render();
}
function renderConfirmModal(){
  const d = state.confirmDialog;
  const bg = document.createElement('div');
  bg.className = 'fixed inset-0 bg-black/40 z-[60] flex items-center justify-center p-6 fade-enter';
  bg.innerHTML = `
    <div class="bg-white rounded-2xl p-5 w-full max-w-xs space-y-4 shadow-xl">
      <p class="text-sm text-gray-800 leading-relaxed">${d.message}</p>
      <div class="flex gap-2">
        <button id="confirm-cancel" class="flex-1 py-2.5 rounded-xl bg-gray-100 text-gray-700 text-sm font-semibold">취소</button>
        <button id="confirm-ok" class="flex-1 py-2.5 rounded-xl bg-red-500 text-white text-sm font-semibold">삭제</button>
      </div>
    </div>
  `;
  bg.querySelector('#confirm-cancel').addEventListener('click', ()=>{ state.confirmDialog = null; render(); });
  bg.querySelector('#confirm-ok').addEventListener('click', ()=>{
    const fn = d.onYes;
    state.confirmDialog = null;
    fn && fn();
  });
  return bg;
}
function uid(p){ return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${y}.${m}.${d}`; }
function fmtWon(n){ if(n===''||n===null||n===undefined||isNaN(n)) return '-'; return Number(n).toLocaleString('ko-KR')+'원'; }
function outfitsUsingItem(id){ return state.outfits.filter(o=>o.itemIds.includes(id)).length; }
// 노트("사이즈: L\n어깨: 51\n...")를 key/value 쌍으로 파싱
function parseSizeNote(note){
  const pairs = {};
  if(!note) return pairs;
  note.split('\n').forEach(line=>{
    const m = line.match(/^\s*([^:：]+)[:：]\s*(.+?)\s*$/);
    if(m) pairs[m[1].trim()] = m[2].trim();
  });
  return pairs;
}
function readFileAsDataURL(file){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); }); }
// 새 아이템 등록 폼의 빈 초안 생성 (모든 사이즈 필드를 미리 빈 값으로 포함)
function blankItemForm(cat){
  const category = cat || CAT_MAIN[0];
  const base = { category, subCategory: (CAT_SUB[category]||[])[0] || '', catExpand: null, photo:null, brand:'', name:'', modelNo:'', purchaseDate:'', price:'', sizeNote:'' };
  SIZE_KEYS.forEach(k=>{ base[k] = ''; });
  return base;
}
// 기존 아이템 → 수정 폼 초안으로 변환
function itemToForm(it){
  const base = blankItemForm(it.category);
  base.subCategory = it.subCategory || (CAT_SUB[it.category]||[])[0] || '';
  base.photo = it.photo; base.brand = it.brand||''; base.name = it.name||''; base.modelNo = it.modelNo||'';
  base.purchaseDate = it.purchaseDate||''; base.price = it.price||''; base.sizeNote = it.sizeNote||'';
  SIZE_KEYS.forEach(k=>{ base[k] = it[k] || ''; });
  return base;
}

async function loadState(){
  if(firebaseReady && state.syncCode){
    state.storageMode = 'firebase';
    try{
      const doc = await db.collection('tagbook').doc(state.syncCode).get();
      if(doc.exists){
        const data = doc.data();
        state.outfits = Array.isArray(data.outfits) ? data.outfits : [];
        state.items = Array.isArray(data.items) ? data.items : [];
      }
    }catch(e){ console.error('불러오기 실패:', e); }
    return;
  }
  if(typeof window.storage !== 'undefined'){
    state.storageMode = 'cloud';
    try{
      const res = await window.storage.get('tagbook-data', false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        state.outfits = Array.isArray(parsed.outfits) ? parsed.outfits : [];
        state.items = Array.isArray(parsed.items) ? parsed.items : [];
      }
    }catch(e){ /* 저장된 데이터 없음 */ }
    return;
  }
  try{
    const raw = localStorage.getItem('tagbook-data');
    if(raw){
      const parsed = JSON.parse(raw);
      state.outfits = Array.isArray(parsed.outfits) ? parsed.outfits : [];
      state.items = Array.isArray(parsed.items) ? parsed.items : [];
    }
    state.storageMode = 'local';
  }catch(e){ state.storageMode = 'none'; }
}
async function saveState(){
  if(state.storageMode === 'firebase'){
    try{ await db.collection('tagbook').doc(state.syncCode).set({ outfits: state.outfits, items: state.items, updatedAt: Date.now() }); }
    catch(e){ console.error('저장 실패:', e); }
    return;
  }
  if(state.storageMode === 'cloud'){
    try{ await window.storage.set('tagbook-data', JSON.stringify({ outfits: state.outfits, items: state.items }), false); }
    catch(e){ console.error('저장 실패:', e); }
  } else if(state.storageMode === 'local'){
    try{ localStorage.setItem('tagbook-data', JSON.stringify({ outfits: state.outfits, items: state.items })); }
    catch(e){ console.error('저장 실패:', e); }
  }
}

function sortItems(list, key, dir){
  const arr = list.slice();
  const mul = dir === 'asc' ? 1 : -1;
  if(key === 'freq') arr.sort((a,b)=> outfitsUsingItem(b.id) - outfitsUsingItem(a.id));
  else if(key === 'purchase') arr.sort((a,b)=>{
    if(!a.purchaseDate && !b.purchaseDate) return 0;
    if(!a.purchaseDate) return 1;
    if(!b.purchaseDate) return -1;
    return a.purchaseDate.localeCompare(b.purchaseDate) * mul;
  });
  else if(key === 'price') arr.sort((a,b)=> ((Number(a.price)||0) - (Number(b.price)||0)) * mul);
  else arr.sort((a,b)=> (b.id > a.id ? 1 : -1)); // recent (registered)
  return arr;
}

// 사이즈 비교표 정렬: 옷 사이즈는 XS~XXXL 순서로, 신발은 사이즈 라벨 속 괄호 안 숫자(예: 'UK 8(270)' → 270, 한국 mm 사이즈 기준)로 오름차순
const SIZE_LETTER_ORDER = ['XXS','XS','S','M','L','XL','XXL','2XL','XXXL','3XL','4XL','5XL'];
function sizeSortKey(it, main){
  const label = (it.sizeLabel||'').trim();
  if(!label) return null;
  if(main === '신발'){
    const paren = label.match(/\(([\d.]+)\)/);
    if(paren) return parseFloat(paren[1]);
    const num = label.match(/([\d.]+)/);
    if(num) return parseFloat(num[1]);
    return null;
  }
  const upper = label.toUpperCase().replace(/\s/g,'');
  const idx = SIZE_LETTER_ORDER.indexOf(upper);
  if(idx !== -1) return idx;
  const num = label.match(/([\d.]+)/);
  if(num) return parseFloat(num[1]);
  return null;
}
function sortBySize(list, main){
  return list.slice().sort((a,b)=>{
    const ka = sizeSortKey(a, main);
    const kb = sizeSortKey(b, main);
    if(ka===null && kb===null) return 0;
    if(ka===null) return 1;
    if(kb===null) return -1;
    return ka - kb;
  });
}

/* ============================================================
   ROOT RENDER
   ============================================================ */
function render(){
  const app = document.getElementById('app');

  // 재렌더링(innerHTML 초기화) 시 입력 중이던 텍스트 필드의 포커스/커서 위치를 보존
  const activeEl = document.activeElement;
  let focusInfo = null;
  if(activeEl && app.contains(activeEl) && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA') && activeEl.id){
    focusInfo = { id: activeEl.id, start: activeEl.selectionStart, end: activeEl.selectionEnd };
  }

  app.innerHTML = '';

  if(outsideClickHandler){ document.removeEventListener('click', outsideClickHandler); outsideClickHandler = null; }

  if(firebaseReady && !state.syncCode){
    app.appendChild(renderSyncSetup());
    return;
  }

  const shell = document.createElement('div');
  shell.className = 'flex flex-col h-dvh w-full relative';
  shell.appendChild(renderHeader());
  shell.appendChild(renderMain());
  shell.appendChild(renderFAB());
  shell.appendChild(renderBottomNav());
  app.appendChild(shell);

  if(state.registerDraft) app.appendChild(renderOutfitRegisterView());
  if(state.itemFlow) app.appendChild(renderItemFlowModal());
  if(state.coordiDetailId) app.appendChild(renderCoordiDetailModal());
  if(state.itemBriefId) app.appendChild(renderItemBriefSheet());
  if(state.itemFullId) app.appendChild(renderItemFullModal());
  if(state.categoryPopupOpen) app.appendChild(renderCategoryPopup());
  if(state.sizePopupOpen) app.appendChild(renderSizePopup());
  if(state.confirmDialog) app.appendChild(renderConfirmModal());

  if(state.monthPickerOpen){
    setTimeout(()=>{
      outsideClickHandler = ()=>{
        state.monthPickerOpen = false;
        outsideClickHandler = null;
        render();
      };
      document.addEventListener('click', outsideClickHandler, { once:true });
    }, 0);
  }

  if(focusInfo){
    const el = document.getElementById(focusInfo.id);
    if(el){
      el.focus();
      try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
    }
  }
}

function renderMonthPickerPanel(){
  const panel = document.createElement('div');
  panel.className = 'absolute left-4 top-full mt-1 w-64 bg-white rounded-2xl shadow-xl border border-gray-100 p-3 z-30 fade-enter';
  const y = state.calMonth.getFullYear();

  panel.innerHTML = `
    <div class="flex items-center justify-between mb-2 px-1">
      <button id="yr-prev" class="w-7 h-7 rounded-full hover:bg-gray-100 text-gray-500 text-sm">‹</button>

/* ---------- CALENDAR TAB ---------- */
function renderCalendarTab(){
  const wrap = document.createElement('section');
  wrap.className = 'space-y-3 -m-4 p-4 pt-3';

  const y = state.calMonth.getFullYear();
  const m = state.calMonth.getMonth();
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const todayS = todayStr();

  const swipeZone = document.createElement('div');

  const table = document.createElement('div');
  table.className = 'bg-gray-200 rounded-2xl overflow-hidden';

  const dow = document.createElement('div');
  dow.className = 'grid grid-cols-7 gap-px';
  dow.innerHTML = ['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d=>`<div class="text-center text-[10px] font-bold text-gray-400 bg-[#F5F5F6] py-2">${d}</div>`).join('');
  table.appendChild(dow);

  const grid = document.createElement('div');
  grid.className = 'grid grid-cols-7 gap-px';
  for(let i=0;i<startDow;i++){
    const c = document.createElement('div');
    c.className = 'h-16 bg-[#FAFAFA]';
    grid.appendChild(c);
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const outfit = state.outfits.find(o=>o.date===dateStr);
    const cell = document.createElement('div');
    const isToday = dateStr===todayS;
    cell.className = 'h-16 cursor-pointer relative overflow-hidden group ' + (outfit ? 'bg-gray-300' : 'bg-[#FAFAFA] hover:bg-gray-100');
    if(outfit){
      cell.innerHTML = `
        <span class="text-[11px] font-semibold text-white absolute top-1 left-1.5 z-10" style="text-shadow:0 1px 3px rgba(0,0,0,.7);">${d}</span>
        <img src="${outfit.photo}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform" />
      `;
      cell.addEventListener('click', ()=>{ state.coordiDetailId = outfit.id; render(); });
    } else {
      cell.innerHTML = `
        <span class="text-[11px] font-semibold text-black absolute top-1 left-1.5 ${isToday?'w-4 h-4 flex items-center justify-center rounded-full bg-black text-white !text-[10px]':''}">${d}</span>
        <span class="absolute inset-0 flex items-center justify-center text-gray-300 opacity-0 group-hover:opacity-100 transition-opacity text-base">+</span>
      `;
      cell.addEventListener('click', ()=>{
        state.registerDraft = { date: dateStr, location:'', photo:null, itemIds:[] };
        render();
      });
    }
    grid.appendChild(cell);
  }
  table.appendChild(grid);
  swipeZone.appendChild(table);
  wrap.appendChild(swipeZone);

  const note = document.createElement('p');
  note.className = 'text-[11px] text-gray-400 text-center pt-2';
  note.textContent =
    state.storageMode === 'firebase' ? `🔗 "${state.syncCode}" 코드로 기기 간 연동 중이에요` :
    state.storageMode === 'cloud' ? '☁️ 코디와 아이템은 자동으로 저장돼요' :
    state.storageMode === 'local' ? '📱 이 기기 브라우저에 저장돼요 (다른 기기와는 공유되지 않아요)' :
    '※ 지금은 저장이 지원되지 않는 환경이라 새로고침하면 초기화돼요';
  wrap.appendChild(note);

  // 스와이프로 월 이동
  let tsX=0, tsY=0;
  swipeZone.addEventListener('touchstart', e=>{ tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; }, { passive:true });
  swipeZone.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - tsX;
    const dy = e.changedTouches[0].clientY - tsY;
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5){
      state.calMonth = new Date(y, dx < 0 ? m+1 : m-1, 1);
      render();
    }
  }, { passive:true });

  return wrap;
}

// 구매일/구매가 정렬 토글 버튼 행 (전체·카테고리 화면 공통 사용)
function buildSortRow(){
  const sortRow = document.createElement('div');
  sortRow.className = 'flex gap-2 shrink-0';
  function sortBtnHTML(key,label){
    const active = state.searchSort===key;
    const arrow = active ? (state.searchSortDir==='asc' ? '▲' : '▼') : '';
    return `<button data-sortkey="${key}" class="cat-sort-btn px-3 py-1 rounded-full text-[11px] font-bold ${active?'bg-gray-900 text-white':'bg-gray-100 text-gray-500'}">${label} ${arrow}</button>`;
  }
  sortRow.innerHTML = sortBtnHTML('purchase','구매일') + sortBtnHTML('price','구매가');
  sortRow.querySelectorAll('.cat-sort-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const key = b.dataset.sortkey;
      if(state.searchSort === key){ state.searchSortDir = state.searchSortDir === 'asc' ? 'desc' : 'asc'; }
      else { state.searchSort = key; state.searchSortDir = 'desc'; }
      render();
    });
  });
  return sortRow;
}

// 검색어(브랜드/제품명 접두어)에 매칭되는지 확인 - 대소문자 무시, 단어 단위 접두어 매칭
function itemMatchesQuery(it, q){
  const brand = (it.brand || '').toLowerCase();
  const name = (it.name || '').toLowerCase();
  const hay = (brand + ' ' + name).trim();
  if(hay.startsWith(q)) return true;
  return hay.split(/\s+/).some(w => w.startsWith(q));
}

function renderSearchTab(){
  const wrap = document.createElement('section');
  wrap.className = 'space-y-4';

  // 상단 검색창 (브랜드/제품명 검색)
  const searchBar = document.createElement('div');
  searchBar.className = 'relative';
  searchBar.innerHTML = `
    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none">🔍</span>
    <input type="text" id="item-search-input" placeholder="브랜드, 제품명 검색" value="${state.searchQuery || ''}" class="w-full bg-gray-100 rounded-full pl-9 pr-4 py-2.5 text-sm outline-none placeholder-gray-400" />
  `;
  wrap.appendChild(searchBar);

  const area = document.createElement('div');
  area.id = 'search-content-area';
  wrap.appendChild(area);

  searchBar.querySelector('#item-search-input').addEventListener('input', e=>{
    state.searchQuery = e.target.value;
    render();
  });

  if(state.items.length === 0){
    area.innerHTML = `<div class="text-center py-20 text-gray-700/60 text-sm">아직 등록된 아이템이 없어요.<br/>코디를 등록하면서 아이템을 함께 추가해보세요.</div>`;
    return wrap;
  }

  const query = (state.searchQuery || '').trim().toLowerCase();
  if(query){
    const matched = sortItems(state.items.filter(it => itemMatchesQuery(it, query)), state.searchSort, state.searchSortDir);
    if(matched.length === 0){
      area.innerHTML = `<div class="text-center py-20 text-gray-700/60 text-sm">'${state.searchQuery}'와 일치하는 아이템이 없어요.</div>`;
      return wrap;
    }
    const label = document.createElement('p');
    label.className = 'text-xs text-gray-400 font-semibold';
    label.textContent = `검색 결과 ${matched.length}개`;
    area.appendChild(label);
    const grid = document.createElement('div');
    grid.className = 'grid grid-cols-2 gap-3 mt-3';
    matched.forEach(it=> grid.appendChild(renderItemGridCard(it)));
    area.appendChild(grid);
    return wrap;
  }

  const filter = state.searchFilter;

  if(filter === '전체'){
    // 필터 드롭다운의 '전체': 개수만 표시 (총 구매가는 표시하지 않음)

    // 카테고리 팝업에서 '전체' 선택: 다른 카테고리처럼 총 개수 + 총 구매가 + 정렬 표시
    let list = state.items.slice();
    list = sortItems(list, state.searchSort, state.searchSortDir);

    const totalCount = list.length;
    const totalPrice = list.reduce((s,it)=> s + (Number(it.price)||0), 0);
    const topRow = document.createElement('div');
    topRow.className = 'flex items-start justify-between gap-2';
    const totalLabel = document.createElement('div');
    totalLabel.className = 'flex items-center gap-2 flex-wrap';

    topRow.appendChild(buildSortRow());
    area.appendChild(topRow);

    const grid = document.createElement('div');
    grid.className = 'grid grid-cols-2 gap-3 mt-3';
    list.forEach(it=> grid.appendChild(renderItemGridCard(it)));
    area.appendChild(grid);
  } else if(filter === '카테고리'){
    // 대분류를 골랐으면 소분류 섹션별로 가로 스크롤 카드 나열
    const main = state.searchCat;
    const box = document.createElement('div');
    box.className = 'space-y-6';

    const totalCount = state.items.filter(it=>it.category===main).length;
    const totalPrice = state.items.filter(it=>it.category===main).reduce((s,it)=> s + (Number(it.price)||0), 0);
    const topRow = document.createElement('div');
    topRow.className = 'flex items-start justify-between gap-2';

    const totalLabel = document.createElement('div');
    totalLabel.className = 'flex items-center gap-2 flex-wrap';
    totalLabel.innerHTML = `<span class="text-xs text-gray-400 font-semibold">${main} 총 ${totalCount}개</span><span class="text-xs text-red-500 font-bold">총 구매가 ${totalPrice.toLocaleString('ko-KR')}원</span>`;
    topRow.appendChild(totalLabel);

    const sortRow = document.createElement('div');
    sortRow.className = 'flex gap-2 shrink-0';
    function sortBtnHTML(key,label){
      const active = state.searchSort===key;
      const arrow = active ? (state.searchSortDir==='asc' ? '▲' : '▼') : '';
      return `<button data-sortkey="${key}" class="cat-sort-btn px-3 py-1 rounded-full text-[11px] font-bold ${active?'bg-gray-900 text-white':'bg-gray-100 text-gray-500'}">${label} ${arrow}</button>`;

    sortRow.innerHTML = sortBtnHTML('purchase','구매일') + sortBtnHTML('price','구매가');
    topRow.appendChild(sortRow);
    box.appendChild(topRow);
    sortRow.querySelectorAll('.cat-sort-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        const key = b.dataset.sortkey;
        if(state.searchSort === key){ state.searchSortDir = state.searchSortDir === 'asc' ? 'desc' : 'asc'; }
        else { state.searchSort = key; state.searchSortDir = 'desc'; }
        render();
      });
    });

    const subs = CAT_SUB[main] || [];
    let any = false;
    subs.forEach(sub=>{
      const its = sortItems(state.items.filter(it=>it.category===main && it.subCategory===sub), state.searchSort, state.searchSortDir);
      if(its.length===0) return;
      any = true;
      const row = document.createElement('div');
      row.innerHTML = `<h3 class="font-bold text-sm mb-2 text-gray-950">${sub} <span class="text-gray-400 font-normal">아이템 ${its.length}개</span></h3>`;
      const scroll = document.createElement('div');
      scroll.className = 'flex gap-3 overflow-x-auto custom-scroll pb-2';
      its.forEach(it=>{
        const card = document.createElement('div');
        card.className = 'w-32 flex-shrink-0 bg-white p-2 rounded-2xl border border-gray-100 cursor-pointer';
        card.innerHTML = `<img src="${it.photo}" style="aspect-ratio:${ITEM_PHOTO_ASPECT}" class="w-full object-cover rounded-lg" /><p class="text-xs font-bold truncate mt-1">${it.brand || '브랜드 미상'}</p><p class="text-[10px] text-gray-400 truncate">${it.name || ''}</p>`;
        card.addEventListener('click', ()=>{ state.itemFullId = it.id; render(); });
        scroll.appendChild(card);
      });
      row.appendChild(scroll);
      box.appendChild(row);
    });
    if(!any){
      const empty = document.createElement('div');
      empty.className = 'text-center py-16 text-gray-700/60 text-sm';
      empty.textContent = `등록된 ${main} 아이템이 없어요.`;
      box.appendChild(empty);
    }
    area.appendChild(box);
  } else if(filter === '브랜드'){
    const groups = new Map();
    state.items.forEach(it=>{
      const key = (it.brand && it.brand.trim()) ? it.brand.trim() : '브랜드 미상';
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(it);
    });
    const names = Array.from(groups.keys()).sort((a,b)=>{
      if(a==='브랜드 미상') return 1;
      if(b==='브랜드 미상') return -1;
      return a.localeCompare(b,'ko');
    });
    const box = document.createElement('div');
    box.className = 'space-y-6';
    names.forEach(brand=>{
      const its = groups.get(brand).slice().sort((a,b)=>{
        const na = (a.name || a.category || '').trim();
        const nb = (b.name || b.category || '').trim();
        return na.localeCompare(nb, 'ko');
      });
      const row = document.createElement('div');
      row.innerHTML = `<h3 class="font-bold text-sm mb-2 text-gray-950">${brand}</h3>`;
      const scroll = document.createElement('div');
      scroll.className = 'flex gap-3 overflow-x-auto custom-scroll pb-2';
      its.forEach(it=>{
        const card = document.createElement('div');
        card.className = 'w-32 flex-shrink-0 bg-white p-2 rounded-2xl border border-gray-100 cursor-pointer';
        card.innerHTML = `<img src="${it.photo}" style="aspect-ratio:${ITEM_PHOTO_ASPECT}" class="w-full object-cover rounded-lg" /><p class="text-xs font-semibold truncate mt-1">${it.name || CAT_ICON[it.category]+' '+it.category}</p>`;
        card.addEventListener('click', ()=>{ state.itemFullId = it.id; render(); });
        scroll.appendChild(card);
      });
      row.appendChild(scroll);
      box.appendChild(row);
    });
    area.appendChild(box);
  } else if(filter === '착장 빈도'){
    const list = state.items.slice().sort((a,b)=>{
      const fa = outfitsUsingItem(a.id), fb = outfitsUsingItem(b.id);
      if(fb !== fa) return fb - fa;
      const na = (a.brand || a.name || '').trim();
      const nb = (b.brand || b.name || '').trim();
      return na.localeCompare(nb, 'ko');
    });
    const box = document.createElement('div');
    box.className = 'space-y-2';
    box.innerHTML = `<p class="text-[10px] text-gray-400 font-bold mb-2 tracking-wide">BEST ITEM</p>`;
    list.forEach(it=>{
      const row = document.createElement('div');
      row.className = 'bg-white p-3 rounded-2xl border border-gray-100 flex items-center justify-between gap-3 cursor-pointer';
      row.innerHTML = `
        <div class="flex items-center gap-3 min-w-0 flex-1">
          <img src="${it.photo}" style="aspect-ratio:${SQUARE_ASPECT}" class="w-12 flex-shrink-0 object-cover rounded-lg" />
          <div class="min-w-0 flex-1">
            <p class="text-xs font-bold truncate">${it.brand || '브랜드 미상'}</p>
            <p class="text-[10px] text-gray-400 truncate">${it.name || CAT_ICON[it.category]+' '+it.category}</p>
          </div>
        </div>
        <span class="text-xs font-bold text-gray-900 flex-shrink-0">${outfitsUsingItem(it.id)}회</span>
      `;
      row.addEventListener('click', ()=>{ state.itemFullId = it.id; render(); });
      box.appendChild(row);
    });
    area.appendChild(box);
  } else if(filter === '사이즈 비교'){
    area.appendChild(renderSizeCompare());
  }
  return wrap;
}

/* ---------- 사이즈 비교: 팝업에서 대분류→소분류를 먼저 고르고, 결과 화면엔 선택된 항목만 표시 ---------- */
function renderSizeCompare(){
  const box = document.createElement('div');
  box.className = 'space-y-4';

  if(!state.compareCat){
    const hint = document.createElement('div');
    hint.className = 'text-center py-16 text-gray-700/60 text-sm';
    hint.textContent = '사이즈 비교 필터에서 비교할 카테고리를 선택해주세요.';
    box.appendChild(hint);
    return box;
  }

  const main = state.compareCat;
  const fields = SIZE_FIELDS[main] || [];
  const showCm = CM_HINT_CATS.includes(main);
  const subs = state.compareSubCat ? [state.compareSubCat] : (CAT_SUB[main] || []);

  // 지금 비교 중인 항목 라벨 (탭하면 다시 선택 팝업)
  const labelBtn = document.createElement('button');
  labelBtn.className = 'flex items-center gap-1 text-xs font-bold text-gray-900 bg-gray-100 px-3 py-1.5 rounded-full';
  labelBtn.innerHTML = `${CAT_ICON[main]||''} ${main} · ${state.compareSubCat || '전체'} <span class="text-gray-400 font-normal">▾</span>`;
  labelBtn.addEventListener('click', ()=>{ state.sizePopupOpen = true; render(); });
  box.appendChild(labelBtn);

  const showCmTag = fields.some(f=>f.key==='sizeLabel') && showCm;
  let any = false;

  subs.forEach(sub=>{
    const its = sortBySize(state.items.filter(it=>it.category===main && it.subCategory===sub), main);
    if(its.length===0) return;
    any = true;

    const section = document.createElement('div');
    const headRow = document.createElement('div');
    headRow.className = 'flex items-center justify-between gap-2 mb-2';
    headRow.innerHTML = `<h3 class="font-bold text-sm text-gray-950">${sub} <span class="text-gray-400 font-normal">아이템 ${its.length}개</span></h3>${showCmTag ? '<span class="text-gray-400 font-normal text-[10px] shrink-0">(cm)</span>' : ''}`;
    section.appendChild(headRow);

    const tableWrap = document.createElement('div');
    tableWrap.className = 'overflow-x-auto custom-scroll bg-white rounded-2xl border border-gray-100';
    const table = document.createElement('table');
    table.className = 'text-xs border-collapse table-fixed';

    // 필드 타입별 고정 너비 - main(대분류) 하나에 속한 모든 소분류 표가 이 값을 공유하므로
    // 스니커즈/로퍼처럼 서로 다른 소분류라도 열 너비가 항상 동일하게 정렬됨
    function fieldWidthClass(f){
      if(f.type === 'select') return 'w-24';
      if(f.type === 'number') return 'w-14';
      return 'w-16'; // text (사이즈 라벨 등)
    }

    const thead = document.createElement('thead');
    let headCells = `<th class="p-2 sticky left-0 bg-white font-bold w-16 text-center">아이템</th><th class="p-2 font-bold whitespace-nowrap text-left w-20">브랜드</th>`;
    if(fields.length){
      fields.forEach((f,i)=>{
        headCells += `<th class="p-2 font-bold whitespace-nowrap text-center ${fieldWidthClass(f)}">${f.label}</th>`;
      });
    } else {
      headCells += `<th class="p-2 font-bold whitespace-nowrap text-center w-40">사이즈</th>`;
    }
    thead.innerHTML = `<tr class="text-gray-400 text-center">${headCells}</tr>`;
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    its.forEach(it=>{
      const tr = document.createElement('tr');
      tr.className = 'border-t border-gray-100 cursor-pointer active:bg-gray-50';
      let cells = `
        <td class="p-2 sticky left-0 bg-white text-center w-16"><img src="${it.photo}" style="aspect-ratio:${SQUARE_ASPECT}" class="w-9 object-cover rounded-lg mx-auto" /></td>
        <td class="p-2 text-gray-900 font-semibold text-left truncate w-20">${it.brand || '브랜드 미상'}</td>
      `;
      if(fields.length){
        fields.forEach(f=>{ cells += `<td class="p-2 text-gray-700 whitespace-nowrap text-center ${fieldWidthClass(f)}">${it[f.key] || '-'}</td>`; });
      } else {
        cells += `<td class="p-2 text-gray-500 whitespace-pre-wrap text-center w-40">${it.sizeNote || '-'}</td>`;
      }
      tr.innerHTML = cells;
      tr.addEventListener('click', ()=>{ state.itemFullId = it.id; render(); });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    section.appendChild(tableWrap);
    box.appendChild(section);
  });

  if(!any){
    const empty = document.createElement('div');
    empty.className = 'text-center py-16 text-gray-700/60 text-sm';
    empty.textContent = `등록된 ${main}${state.compareSubCat ? ' · '+state.compareSubCat : ''} 아이템이 없어요.`;
    box.appendChild(empty);
  }
  return box;
}

    if(!it) return;
    const chip = document.createElement('div');
    chip.className = 'w-20 relative bg-white border border-gray-100 rounded-xl p-1.5 text-center';

      <button class="rm absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-400 text-white text-[10px]">×</button>
      <img src="${it.photo}" class="w-full h-14 object-cover rounded-lg"/>
      <p class="text-[10px] text-gray-500 mt-1 truncate">${it.category}</p>
      <p class="text-[10px] font-bold truncate">${it.brand || '미상'}</p>
    `;
    chip.querySelector('.rm').addEventListener('click', e=>{
      e.stopPropagation();
      d.itemIds = d.itemIds.filter(x=>x!==id);
      render();
    });
    chipList.appendChild(chip);
  });
  const addChip = document.createElement('button');
  addChip.className = 'w-20 h-[88px] border-2 border-dashed border-gray-200 rounded-xl flex flex-col items-center justify-center text-gray-400 gap-1';
  addChip.innerHTML = `<span class="text-lg">＋</span><span class="text-[10px]">아이템 추가</span>`;
  addChip.addEventListener('click', ()=>{ state.itemFlow = { mode:'choice' }; render(); });
  chipList.appendChild(addChip);

  const dropEl = bg.querySelector('#outfit-photo-drop');
  const inputEl = bg.querySelector('#outfit-photo-input');
  dropEl.addEventListener('click', ()=>inputEl.click());
  inputEl.addEventListener('change', async e=>{
    const f = e.target.files[0];
    if(f){ d.photo = await readFileAsDataURL(f); render(); }
  });
  bg.querySelector('#f-date').addEventListener('input', e=>{ d.date = e.target.value; });
  bg.querySelector('#f-loc').addEventListener('input', e=>{ d.location = e.target.value; });
  bg.querySelector('#cancel-register').addEventListener('click', ()=>{ state.registerDraft = null; render(); });
  bg.querySelector('#save-outfit').addEventListener('click', ()=>{
    if(!d.photo){ alert('코디 전체 사진을 업로드해주세요.'); return; }
    if(!d.date){ alert('날짜를 선택해주세요.'); return; }
    const existingIdx = state.outfits.findIndex(o=>o.date===d.date);
    const outfit = { id: uid('outfit'), date:d.date, location:d.location, photo:d.photo, itemIds:[...d.itemIds] };
    if(existingIdx>-1){
      if(!confirm('해당 날짜에 이미 코디가 있어요. 덮어쓸까요?')) return;
      outfit.id = state.outfits[existingIdx].id;
      state.outfits[existingIdx] = outfit;
    } else {
      state.outfits.push(outfit);
    }
    state.registerDraft = null;
    state.coordiDetailId = outfit.id;
    saveState();
    render();
  });

  return bg;
}

/* ============================================================
   아이템 추가 플로우 (선택 / 기존에서 고르기 / 새로 등록)
   ============================================================ */
/* ---------- 카테고리 인라인 아코디언 (대분류 탭 → 소분류 칩) ---------- */
function renderCatAccordionInto(container, f){
  container.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'border border-gray-200 rounded-xl overflow-hidden divide-y divide-gray-100';
  CAT_MAIN.forEach(main=>{
    const row = document.createElement('div');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'w-full flex items-center justify-between px-3 py-2.5 text-sm text-left ' + (f.category===main ? 'bg-gray-50' : 'bg-white');
    btn.innerHTML = `<span class="${f.category===main?'font-bold text-gray-900':'text-gray-700'}">${CAT_ICON[main]} ${main}${f.category===main && f.subCategory ? `<span class="text-gray-400 font-normal"> · ${f.subCategory}</span>` : ''}</span><span class="text-gray-300 text-xs">${f.catExpand===main?'▲':'▼'}</span>`;
    btn.addEventListener('click', ()=>{ f.catExpand = (f.catExpand===main) ? null : main; render(); });
    row.appendChild(btn);
    if(f.catExpand===main){
      const subWrap = document.createElement('div');
      subWrap.className = 'flex flex-wrap gap-2 p-3 bg-gray-50';
      (CAT_SUB[main]||[]).forEach(sub=>{
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'px-3 py-1.5 rounded-full text-xs font-semibold ' + (f.category===main && f.subCategory===sub ? 'bg-gray-900 text-white' : 'bg-white border border-gray-200 text-gray-600');
        chip.textContent = sub;
        chip.addEventListener('click', ()=>{ f.category = main; f.subCategory = sub; f.catExpand = null; render(); });
        subWrap.appendChild(chip);
      });
      row.appendChild(subWrap);
    }
    box.appendChild(row);
  });
  container.appendChild(box);
}
/* ---------- 카테고리별 구조화 사이즈 입력 필드 ---------- */
function renderSizeFieldsInto(container, f){
  container.innerHTML = '';
  const fields = SIZE_FIELDS[f.category] || [];
  if(fields.length === 0) return;
  const box = document.createElement('div');
  box.className = 'space-y-3';
  fields.forEach(spec=>{
    const row = document.createElement('div');
    if(spec.type === 'select'){
      row.innerHTML = `
        <label class="text-xs font-bold text-gray-800">${spec.label}</label>
        <select data-key="${spec.key}" class="size-field-select w-full mt-1 px-3 py-2 rounded-xl border border-gray-200 bg-white text-sm">
          <option value="">선택 안 함</option>
          ${spec.options.map(o=>`<option value="${o}" ${f[spec.key]===o?'selected':''}>${o}</option>`).join('')}
        </select>`;
    } else {
      row.innerHTML = `
        <label class="text-xs font-bold text-gray-800">${spec.label}</label>
        <input type="${spec.type==='number'?'number':'text'}" data-key="${spec.key}" value="${f[spec.key]||''}" placeholder="${spec.type==='number'?'cm':''}" class="size-field-input block w-full box-border mt-1 px-3 h-11 rounded-xl border border-gray-200 bg-white text-base"/>`;
    }
    box.appendChild(row);
  });
  container.appendChild(box);
  container.querySelectorAll('.size-field-input').forEach(inp=>{
    inp.addEventListener('input', e=>{ f[e.target.dataset.key] = e.target.value; });
  });
  container.querySelectorAll('.size-field-select').forEach(sel=>{
    sel.addEventListener('change', e=>{ f[e.target.dataset.key] = e.target.value; render(); });
  });
}

      SIZE_KEYS.forEach(k=>{ payload[k] = f[k]; });
      if(isEdit){
        const target = state.items.find(x=>x.id===flow.itemId);
        if(target){ Object.assign(target, payload); }
        state.itemFlow = null;
        state.itemFullId = flow.itemId;
        saveState();
        render();
      } else {
        const newItem = Object.assign({ id: uid('item'), owned:true }, payload);
        state.items.push(newItem);
        if(state.registerDraft) state.registerDraft.itemIds.push(newItem.id);
        state.itemFlow = null;
        saveState();
        render();
      }
    });
  }

  bg.appendChild(sheet);
  bg.addEventListener('click', e=>{ if(e.target===bg){ state.itemFlow=null; render(); } });
  return bg;
}

/* ============================================================
   기기 연동 코드 설정
   ============================================================ */
function generateCode(){ return Math.random().toString(36).slice(2,8); }
function renderSyncSetup(){
  const suggested = generateCode();
  const wrap = document.createElement('div');
  wrap.className = 'flex flex-col justify-center h-screen px-6 max-w-md mx-auto';
  wrap.innerHTML = `
    <h2 class="text-xl font-bold text-gray-950 mb-2">기기 연동 코드</h2>
    <p class="text-xs text-gray-700/80 leading-relaxed mb-5">아이폰과 아이패드에 <b>같은 코드</b>를 입력하면 데이터가 하나로 이어져요.<br/>처음이라면 아래 추천 코드를 그대로 쓰거나 원하는 코드를 입력하세요.</p>
    <label class="text-xs font-bold text-gray-800">연동 코드</label>
    <input type="text" id="sync-code-input" placeholder="예: ${suggested}" class="w-full mt-1 mb-4 px-3 py-3 rounded-xl border border-gray-200 bg-white text-base"/>
    <button id="sync-start" class="w-full py-3 bg-gray-900 text-white font-bold rounded-2xl text-sm">시작하기</button>
    <p class="text-[11px] text-gray-600/70 mt-4 leading-relaxed">이 코드는 이 기기에 저장돼서 다음부터는 안 물어봐요.<br/>다른 기기(아이패드 등)에서도 <b>정확히 같은 코드</b>를 입력해야 데이터가 연동돼요.</p>
  `;
  wrap.querySelector('#sync-start').addEventListener('click', async ()=>{
    let code = wrap.querySelector('#sync-code-input').value.trim();
    if(!code) code = suggested;
    code = code.toLowerCase().replace(/[^a-z0-9]/g,'');
    if(!code){ alert('코드를 입력해주세요.'); return; }
    try{ localStorage.setItem('tagbook-sync-code', code); }catch(e){}
    state.syncCode = code;
    const app = document.getElementById('app');
    app.innerHTML = '<div class="flex items-center justify-center h-screen text-sm text-gray-700/70">불러오는 중…</div>';
    await loadState();
    render();
  });
  return wrap;
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="flex items-center justify-center h-screen text-sm text-gray-700/70">불러오는 중…</div>';
  if(firebaseReady && !state.syncCode){
    render();
    return;
  }
  await loadState();
  render();
}
init();
</script>
